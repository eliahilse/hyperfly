[package]
name = "hyperfly-core"
version = "0.1.1-alpha.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
description = "Rust codec for the hyperfly wire format: schema-compiled binary encoding for typed APIs"
homepage = "https://hyperfly.dev"
repository = "https://github.com/eliahilse/hyperfly"
documentation = "https://docs.rs/hyperfly-core"
readme = "README.md"
keywords = ["serialization", "binary", "codec", "columnar", "compression"]
categories = ["encoding", "compression"]
include = ["src/**/*.rs", "Cargo.toml", "README.md", "LICENSE", "NOTICE"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
sha2 = "0.10"
miniz_oxide = "0.8"

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
serde = "1"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "unbounded_depth"] }
serde_stacker = "0.1"
