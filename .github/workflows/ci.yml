name: ci

on:
  pull_request:
  push:
    branches: [main]
  # the release workflow dispatches CI on its release PR, which GITHUB_TOKEN pushes never trigger
  workflow_dispatch:

# pull requests share one group per branch and cancel superseded runs; every main run gets its own group
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - run: bun run lint

      - run: bun run check-types

      - run: bun run test

  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - run: bun run build --filter=hyperfly

      - name: publint
        working-directory: packages/hyperfly
        run: bunx publint@0.3.25

      - name: are the types wrong
        working-directory: packages/hyperfly
        run: bunx @arethetypeswrong/cli@0.18.5 --pack --profile esm-only

  release-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - run: bun test ./.github/scripts/

      - name: Python and Rust versions match their changeset manifests
        run: bun .github/scripts/sync-versions.ts --check

      # the release PR consumes changesets rather than adding them
      - name: Changesets
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
        run: bun .github/scripts/check-changesets.ts origin/${{ github.base_ref }}

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - run: pip install "./python[test]"

      - run: pytest python/tests -q

  # the oldest supported Python with the oldest pydantic the package declares
  python-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - run: pip install "./python[test]" "pydantic==2.5.*"

      - run: python -c "import pydantic; assert pydantic.VERSION.startswith('2.5.'), pydantic.VERSION"

      - run: pytest python/tests -q

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings

      - run: cargo test --manifest-path rust/Cargo.toml

  # the library builds on the rust-version Cargo.toml declares; the dev-dependencies need a newer toolchain
  rust-msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.82

      - run: cargo check --manifest-path rust/Cargo.toml --lib --locked

  interop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: bun install --frozen-lockfile

      - run: bun run build --filter=hyperfly

      - run: pip install ./python

      # a TypeScript server and a Python client over the real protocol: the proof
      # the golden vectors imply but cannot demonstrate
      - name: cross-language interop
        run: |
          bun apps/interop/server.ts &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8787/fingerprints > /dev/null && break
            sleep 1
          done
          python apps/interop/client.py

  # a dispatched run's checks never show on a pull request, so the release PR gets them as commit statuses
  dispatch-pending:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$REPO/statuses/$SHA" --silent \
            -f state=pending -f context=ci -f description=Running -f target_url="$RUN_URL"

  dispatch-report:
    needs: [dispatch-pending, check, pack, release-checks, python, python-floor, rust, rust-msrv, interop]
    if: always() && github.event_name == 'workflow_dispatch'
    permissions:
      actions: read
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CI_SUCCESS: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: |
          set -euo pipefail
          jobs="$(gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs" \
            --jq '.jobs[] | select(.name != "dispatch-report" and .name != "dispatch-pending") | @json')"
          while IFS= read -r job; do
            [ -n "$job" ] || continue
            name="$(jq -r '.name' <<< "$job")"
            conclusion="$(jq -r '.conclusion' <<< "$job")"
            url="$(jq -r '.html_url' <<< "$job")"
            case "$conclusion" in
              success) state=success; description=Passed ;;
              skipped) state=success; description=Skipped ;;
              cancelled) state=error; description=Cancelled ;;
              *) state=failure; description=Failed ;;
            esac
            gh api --method POST "repos/$REPO/statuses/$SHA" --silent \
              -f state="$state" -f context="$name" -f description="$description" -f target_url="$url" \
              || echo "::warning::could not post the status for $name"
          done <<< "$jobs"
          if [ "$CI_SUCCESS" = true ]; then
            state=success
            description=Passed
          else
            state=failure
            description=Failed
          fi
          gh api --method POST "repos/$REPO/statuses/$SHA" --silent \
            -f state="$state" -f context=ci -f description="$description" -f target_url="$RUN_URL"
