name: ci

on:
  pull_request:
  push:
    branches: [main]

# pull requests share one group per branch and cancel superseded runs; every main run gets its own group
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - run: bun run lint

      - run: bun run check-types

      - run: bun run test

  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - run: bun run build --filter=hyperfly

      - name: publint
        working-directory: packages/hyperfly
        run: bunx publint@0.3.25

      - name: are the types wrong
        working-directory: packages/hyperfly
        run: bunx @arethetypeswrong/cli@0.18.5 --pack --profile esm-only

  release-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - run: bun test ./.github/scripts/

      - name: Python and Rust versions match their changeset manifests
        run: bun .github/scripts/sync-versions.ts --check

      # the release PR consumes changesets rather than adding them
      - name: Changesets
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
        run: bun .github/scripts/check-changesets.ts origin/${{ github.base_ref }}

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - run: pip install "./python[test]"

      - run: pytest python/tests -q

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings

      - run: cargo test --manifest-path rust/Cargo.toml

  # the library builds on the rust-version Cargo.toml declares; the dev-dependencies need a newer toolchain
  rust-msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.82

      - run: cargo check --manifest-path rust/Cargo.toml --lib --locked

  interop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: bun install --frozen-lockfile

      - run: bun run build --filter=hyperfly

      - run: pip install ./python

      # a TypeScript server and a Python client over the real protocol: the proof
      # the golden vectors imply but cannot demonstrate
      - name: cross-language interop
        run: |
          bun apps/interop/server.ts &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8787/fingerprints > /dev/null && break
            sleep 1
          done
          python apps/interop/client.py
